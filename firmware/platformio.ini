[platformio]
src_dir = main
default_envs = esp32dev_demo

; Operação nominal: amostragem e envio a cada 5 min (UC05-R1), fila de
; 1.024 leituras.
[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -DAPP_SENSOR_SAMPLE_INTERVAL_S=300

; Demonstração/apresentação: mesmo firmware, amostragem a cada 30 s.
; pio run -e esp32dev_demo -t upload
[env:esp32dev_demo]
extends = env:esp32dev
build_flags =
    -DAPP_SENSOR_SAMPLE_INTERVAL_S=30

; Teste de buffer cheio (SCRUM-35): 30 s e fila de 10 leituras, para encher
; o buffer em ~5 min com o broker desligado. Não usar em operação.
[env:esp32dev_teste_buffer]
extends = env:esp32dev
build_flags =
    -DAPP_SENSOR_SAMPLE_INTERVAL_S=30
    -DTELEMETRY_QUEUE_MAX_ITEMS=10
