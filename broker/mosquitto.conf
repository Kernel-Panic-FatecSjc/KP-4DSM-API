# Broker MQTT da cadeia de dados (VPS 1 da arquitetura, docs/mqtt-topico-payload.md).

listener 1883
# Sem anônimo: cada estação entra com usuário = vid e senha = chave de ingestão,
# cadastrados pelo backend no plugin dynamic-security.
allow_anonymous false
per_listener_settings false

# Fila persistente: a sessão da ingestão é persistente (clean: false), então o
# broker guarda o que chegar enquanto ela estiver fora do ar e grava em disco
# para sobreviver também a um restart do próprio broker.
persistence true
persistence_location /mosquitto/data/
autosave_interval 5
# Padrão é 1000 mensagens por cliente desconectado: com a ingestão parada
# alguns minutos a frota passaria disso e o excedente seria descartado.
max_queued_messages 1000000
max_queued_bytes 0
# Mensagens QoS 1 em trânsito por cliente (padrão 20): a ingestão confirma na
# chegada, e um teto baixo limitaria a vazão com a VPS da ingestão longe.
max_inflight_messages 1000

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
