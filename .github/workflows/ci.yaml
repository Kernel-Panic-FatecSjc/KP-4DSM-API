name: CI

# Só a main: pela estratégia de branches (docs/estrategiabranch.md) todo PR de
# tarefa vai para ela. A staging é atualizada pelo workflow de validação em
# staging, a partir do PR que já passou por este CI.
on:
  # Push só de documentação nem dispara o pipeline. No PR não dá para usar
  # paths-ignore: um check obrigatório que não roda deixa o PR esperando para
  # sempre. Lá o workflow sempre dispara e o job "Detectar alterações" pula o
  # que não foi tocado (job pulado conta como aprovado).
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/*.md'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  alteracoes:
    name: Detectar alterações
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      backend_testes: ${{ steps.filtro.outputs.backend_testes }}
      banco: ${{ steps.filtro.outputs.banco }}
      frontend: ${{ steps.filtro.outputs.frontend }}
      frontend_testes: ${{ steps.filtro.outputs.frontend_testes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # As regras de qual arquivo liga qual job ficam no script, que dá para
      # testar localmente: git diff --name-only main | bash .github/scripts/detectar-alteracoes.sh
      - id: filtro
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          # Push sem commit anterior no histórico (branch nova ou push forçado):
          # não dá para saber o que mudou, então tudo roda.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Sem commit base para comparar: todos os jobs rodam."
            echo .github/workflows/ci.yaml | bash .github/scripts/detectar-alteracoes.sh >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Arquivos alterados e jobs que cada um liga:"
          git diff --name-only "$base" HEAD | bash .github/scripts/detectar-alteracoes.sh | tee -a "$GITHUB_OUTPUT"

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: alteracoes
    if: needs.alteracoes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: ./kernelpanic-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: kernelpanic-backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Serviços da cadeia de dados (servicos/ingestao e servicos/tratamento),
      # que vão para VPS próprias mas dividem o pacote com a API.
      - name: Build dos serviços de ingestão e tratamento
        run: npm run build:servicos

  testes:
    name: Testes (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: alteracoes
    if: false # temporariamente desabilitado: testes funcionais/unitários com erros de tipo pendentes de migration (ESTACAO_NAO_CADASTRADA)
    defaults:
      run:
        working-directory: ./kernelpanic-backend

    # Job separado dos demais por causa da versão do Node: @nestjs/common@12 é
    # ESM-only e o require do sandbox do Jest só delega para o require(esm)
    # nativo a partir do Node 24.9. Em Node 20 toda spec que importe
    # @nestjs/common falha com "Must use import to load ES Module". Os outros
    # jobs seguem no 20 porque lint, typecheck e build não executam o código.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kernelpanic
          POSTGRES_PASSWORD: kernelpanic
          POSTGRES_DB: kernelpanic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kernelpanic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kernelpanic:kernelpanic@localhost:5432/kernelpanic?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: kernelpanic-backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Testes unitários
        if: github.event_name != 'pull_request'
        run: npm run test

      # Os testes funcionais recriam e migram o próprio banco (kernelpanic_test)
      # no globalSetup, então não há passo de migrations aqui.
      - name: Testes funcionais
        if: github.event_name != 'pull_request'
        run: npm run test:functional

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: alteracoes
    if: needs.alteracoes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ./frontend/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  frontend-testes:
    name: Testes (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: alteracoes
    if: needs.alteracoes.outputs.frontend_testes == 'true'
    defaults:
      run:
        working-directory: ./frontend/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes unitários
        if: github.event_name != 'pull_request'
        run: npm run test

      # Baixa o Chromium da versão do @playwright/test do lockfile, com as
      # bibliotecas de sistema que ele precisa no Ubuntu.
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # O próprio Playwright faz o build de produção e sobe o Next.js (webServer
      # do playwright.config.ts). A API não sobe: os testes respondem as rotas
      # interceptando as requisições no navegador.
      - name: Testes funcionais
        if: github.event_name != 'pull_request'
        run: npm run test:functional

      # Na falha, o relatório traz o trace de cada teste: abra com
      # npx playwright show-report <pasta baixada>/playwright-report.
      - name: Publicar relatório dos testes funcionais
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            frontend/frontend/playwright-report/
            frontend/frontend/test-results/
          retention-days: 7

  migrations:
    name: Banco e Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: alteracoes
    if: needs.alteracoes.outputs.banco == 'true'
    defaults:
      run:
        working-directory: ./kernelpanic-backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kernelpanic
          POSTGRES_PASSWORD: kernelpanic
          POSTGRES_DB: kernelpanic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kernelpanic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kernelpanic:kernelpanic@localhost:5432/kernelpanic?schema=public
      SHADOW_DATABASE_URL: postgresql://kernelpanic:kernelpanic@localhost:5432/kernelpanic_shadow

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrations existentes não podem ser alteradas
        if: github.event_name == 'pull_request'
        run: |
          alteradas=$(git diff --name-only --diff-filter=MDR \
            "${{ github.event.pull_request.base.sha }}" HEAD -- prisma/migrations || true)
          if [ -n "$alteradas" ]; then
            echo "::error::Migrations já existentes na ${{ github.base_ref }} foram alteradas:"
            echo "$alteradas"
            echo "Crie uma migration NOVA em vez de editar uma existente."
            exit 1
          fi
          echo "Nenhuma migration existente foi alterada."

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: kernelpanic-backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Validar schema
        run: npx prisma validate

      - name: Criar shadow database
        run: |
          PGPASSWORD=kernelpanic psql -h localhost -U kernelpanic -d kernelpanic \
            -c 'CREATE DATABASE kernelpanic_shadow;'

      - name: Aplicar migrations em banco vazio
        run: npx prisma migrate deploy

      - name: Diferença entre schema.prisma e migrations
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code

      - name: Seed
        run: npm run db:seed

  # Check único exigido na main: os jobs acima são pulados conforme o que o PR
  # altera, e um job pulado conta como aprovado. Assim o ruleset não precisa
  # listar cada job, e um job novo entra no portão só por estar no needs.
  ci-ok:
    name: CI ok
    if: always()
    needs: [alteracoes, backend, testes, frontend, frontend-testes, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Algum job falhou ou foi cancelado
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - run: echo "Todos os jobs passaram ou foram pulados pelo filtro de alterações."
