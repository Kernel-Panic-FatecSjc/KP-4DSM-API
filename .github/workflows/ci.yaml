name: CI

on:
  push:
    branches: [main, develop, release]
  pull_request:
    branches: [main, develop, release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  alteracoes:
    name: Detectar alterações
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      frontend: ${{ steps.filtro.outputs.frontend }}
      banco: ${{ steps.filtro.outputs.banco }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filtro
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TITULO_PR: ${{ github.event.pull_request.title }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Tarefa de docs (docs/padraocommit.md) não roda as verificações. No
          # PR ela é identificada pelo tipo no título; no push direto na main
          # (exceção de docs/estrategiabranch.md), por todos os commits
          # enviados serem docs. Se a tarefa mexer em qualquer arquivo fora de
          # docs/ ou .md, segue o fluxo normal, como a exceção exige.
          DOCS='^docs\(SCRUM-[0-9]+\): '
          tarefa_docs=false

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
            if printf '%s' "$TITULO_PR" | grep -qE "$DOCS"; then tarefa_docs=true; fi
          else
            base="$BEFORE_SHA"
            # Branch nova (before zerado) ou push forçado com o before fora do
            # histórico baixado: sem intervalo confiável, a tarefa não é
            # tratada como docs.
            if git cat-file -e "$base^{commit}" 2>/dev/null; then
              assuntos=$(git log --no-merges --format=%s "$base..HEAD")
              if [ -n "$assuntos" ] && ! printf '%s\n' "$assuntos" | grep -qvE "$DOCS"; then
                tarefa_docs=true
              fi
            fi
          fi

          if [ "$tarefa_docs" = true ] && ! git diff --name-only "$base" HEAD | grep -qvE '^docs/|\.md$'; then
            echo "Tarefa de docs só com documentação: nenhuma verificação roda."
            {
              echo "backend=false"
              echo "frontend=false"
              echo "banco=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Em push numa branch integradora (main, develop, release) nada é
          # filtrado: elas são a referência de integração e o status delas
          # precisa cobrir o projeto inteiro, não só o que o commit tocou.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Push em $GITHUB_REF_NAME: todos os jobs rodam."
            {
              echo "backend=true"
              echo "frontend=true"
              echo "banco=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          arquivos=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Arquivos alterados neste PR:"
          echo "$arquivos"

          casa() {
            printf '%s\n' "$arquivos" | grep -qE "$1"
          }

          backend=false
          frontend=false
          banco=false

          if casa '^\.github/workflows/'; then
            # Mudança no próprio pipeline revalida tudo: as regras dos jobs
            # são o que está sendo alterado.
            backend=true
            frontend=true
            banco=true
          else
            if casa '^kernelpanic-backend/'; then backend=true; fi
            if casa '^frontend/'; then frontend=true; fi
            if casa '^kernelpanic-backend/(prisma/|prisma7\.config\.ts)'; then banco=true; fi
          fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "banco=$banco"
          } >> "$GITHUB_OUTPUT"

          echo "backend=$backend  frontend=$frontend  banco=$banco"

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: alteracoes
    if: needs.alteracoes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: ./kernelpanic-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kernelpanic-backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  testes:
    name: Testes (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: alteracoes
    if: needs.alteracoes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: ./kernelpanic-backend

    # Job separado dos demais por causa da versão do Node: @nestjs/common@12 é
    # ESM-only e o require do sandbox do Jest só delega para o require(esm)
    # nativo a partir do Node 24.9. Em Node 20 toda spec que importe
    # @nestjs/common falha com "Must use import to load ES Module". Os outros
    # jobs seguem no 20 porque lint, typecheck e build não executam o código.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kernelpanic
          POSTGRES_PASSWORD: kernelpanic
          POSTGRES_DB: kernelpanic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kernelpanic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kernelpanic:kernelpanic@localhost:5432/kernelpanic?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: kernelpanic-backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Testes unitários
        run: npm run test

      # Os testes funcionais recriam e migram o próprio banco (kernelpanic_test)
      # no globalSetup, então não há passo de migrations aqui.
      - name: Testes funcionais
        run: npm run test:functional

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: alteracoes
    if: needs.alteracoes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ./frontend/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  migrations:
    name: Banco e Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: alteracoes
    if: needs.alteracoes.outputs.banco == 'true'
    defaults:
      run:
        working-directory: ./kernelpanic-backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kernelpanic
          POSTGRES_PASSWORD: kernelpanic
          POSTGRES_DB: kernelpanic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kernelpanic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kernelpanic:kernelpanic@localhost:5432/kernelpanic?schema=public
      SHADOW_DATABASE_URL: postgresql://kernelpanic:kernelpanic@localhost:5432/kernelpanic_shadow

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrations existentes não podem ser alteradas
        if: github.event_name == 'pull_request'
        run: |
          alteradas=$(git diff --name-only --diff-filter=MDR \
            "${{ github.event.pull_request.base.sha }}" HEAD -- prisma/migrations || true)
          if [ -n "$alteradas" ]; then
            echo "::error::Migrations já existentes na ${{ github.base_ref }} foram alteradas:"
            echo "$alteradas"
            echo "Crie uma migration NOVA em vez de editar uma existente."
            exit 1
          fi
          echo "Nenhuma migration existente foi alterada."

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kernelpanic-backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Validar schema
        run: npx prisma validate

      - name: Criar shadow database
        run: |
          PGPASSWORD=kernelpanic psql -h localhost -U kernelpanic -d kernelpanic \
            -c 'CREATE DATABASE kernelpanic_shadow;'

      - name: Aplicar migrations em banco vazio
        run: npx prisma migrate deploy

      - name: Diferença entre schema.prisma e migrations
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code

      - name: Seed
        run: npm run db:seed
