name: Padrão de commit e PR

on:
  pull_request:
    branches: [main, develop, release]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  padrao:
    name: Padrão de commit e PR
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar título do PR e mensagens de commit
        env:
          TITULO_PR: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          PADRAO='^(feat|fix|docs|style|refactor|test|chore|ci)\(SCRUM-[0-9]+\): .+'

          falhas=0

          validar() {
            if printf '%s' "$2" | grep -qE "$PADRAO"; then
              echo "  ok   $1: $2"
            else
              echo "::error::$1 fora do padrão: $2"
              falhas=$((falhas + 1))
            fi
          }

          validar "Título do PR" "$TITULO_PR"

          # Commits de merge ficam de fora: a mensagem é gerada pelo GitHub e
          # não tem como seguir a convenção.
          while IFS= read -r assunto; do
            [ -z "$assunto" ] && continue
            validar "Commit" "$assunto"
          done < <(git log --no-merges --format=%s "$BASE_SHA..HEAD")

          if [ "$falhas" -gt 0 ]; then
          cat <<'AJUDA'

          Formato esperado:  tipo(SCRUM-{ID}): descrição

            tipo         feat, fix, docs, style, refactor, test, chore, ci
            SCRUM-{ID}   ID da tarefa no Jira, obrigatório em todos os tipos

          Um espaço depois dos dois-pontos, e a descrição não pode ser vazia.

          Exemplos:
            feat(SCRUM-12): Criação da tela de login
            fix(SCRUM-34): Correção da validação de e-mail
            docs(SCRUM-14): Atualização da documentação dos requisitos

          Padrão completo:
          https://github.com/Kernel-Panic-FatecSjc/KP-4DSM-API/blob/main/docs/padraocommit.md

          Para corrigir um commit já enviado: `git commit --amend` no último,
          `git rebase -i` nos anteriores, e push forçado na sua branch.
          AJUDA
            exit 1
          fi

          echo "Título do PR e commits dentro do padrão."
