name: Testar instalação no Windows

# Ensaio do instalador (infra/servidor) num Windows Server 2025 do GitHub, sem
# depender da VM: preparar-servidor.ps1 de verdade (WinSW, serviços do Windows,
# permissões, Caddy, firewall) e deploy.ps1 de verdade (junction, npm ci,
# migrate, restart, /saude, rollback automático e manual).
#
# O pacote é FALSO e mínimo: a API, a ingestão e o tratamento são servidores
# HTTP de poucas linhas que só respondem /saude, e "prisma" e "next" são pacotes
# locais que imitam o CLI. O que se testa é a instalação, não a aplicação (essa
# é testada pelo CI e pela suíte noturna).

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/servidor/**'
      - '.github/workflows/testar-instalacao-windows.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensaio:
    name: Ensaio da instalação (Windows Server 2025)
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    env:
      BASE: C:\datapanic
      SHA_A: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      SHA_B: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      SHA_C: cccccccccccccccccccccccccccccccccccccccc

    steps:
      - uses: actions/checkout@v4

      - name: Análise estática dos scripts
        run: |
          $falhas = 0
          # O PowerShell 5.1 lê .ps1 sem BOM como ANSI e estraga os acentos.
          foreach ($f in Get-ChildItem infra\servidor\*.ps1) {
            $b = [IO.File]::ReadAllBytes($f.FullName)
            if (-not ($b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) { Write-Host "::error file=$($f.Name)::Salve como UTF-8 com BOM."; $falhas++ }
          }
          foreach ($f in Get-ChildItem infra\servidor\*.ps1) {
            $erros = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$erros) | Out-Null
            foreach ($e in $erros) { Write-Host "::error file=$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $falhas++ }
          }
          if (Get-Module -ListAvailable PSScriptAnalyzer) {
            $achados = Invoke-ScriptAnalyzer -Path infra\servidor -Severity Error
            $achados | ForEach-Object { Write-Host "::error file=$($_.ScriptName),line=$($_.Line)::$($_.RuleName): $($_.Message)"; $falhas++ }
          }
          if ($falhas) { exit 1 }

      - name: Pré-requisitos (Caddy)
        run: |
          Write-Host "node $(node -v) em $((Get-Command node).Source)"
          New-Item -ItemType Directory C:\caddy -Force | Out-Null
          Invoke-WebRequest https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_windows_amd64.zip -OutFile $env:RUNNER_TEMP\caddy.zip -UseBasicParsing
          Expand-Archive $env:RUNNER_TEMP\caddy.zip C:\caddy -Force

      - name: Preparar o servidor (1ª execução cria o .env)
        run: |
          .\infra\servidor\preparar-servidor.ps1 -Ambiente pre-release -RunnerConta $env:USERNAME
          if (-not (Test-Path "$env:BASE\shared\.env")) { Write-Host '::error::O .env não foi criado.'; exit 1 }
          # Preenche os TROQUE como a prefeitura faria. Site em HTTP na 8080: o
          # ensaio não tem domínio nem certificado.
          $t = Get-Content "$env:BASE\shared\.env" -Raw
          $t = $t.Replace('DOMINIO="TROQUE.exemplo.gov.br"', 'DOMINIO="http://localhost:8080"').Replace('TROQUE', 'ensaio')
          [IO.File]::WriteAllText("$env:BASE\shared\.env", $t)

      - name: Preparar o servidor (2ª execução instala os serviços)
        run: |
          .\infra\servidor\preparar-servidor.ps1 -Ambiente pre-release -RunnerConta $env:USERNAME
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($s in 'datapanic-api', 'datapanic-ingestao', 'datapanic-tratamento', 'datapanic-front', 'caddy') {
            $svc = Get-Service $s -ErrorAction SilentlyContinue
            if (-not $svc) { Write-Host "::error::Serviço $s não foi instalado."; exit 1 }
            Write-Host "$s $($svc.Status) $($svc.StartType)"
          }

      - name: Montar pacotes falsos (A e B saudáveis, C quebrado)
        run: |
          function Pacote([string]$sha, [int]$status) {
            $raiz = Join-Path $env:RUNNER_TEMP "montar-$sha"
            $api = "$raiz\kernelpanic-backend"; $web = "$raiz\frontend\frontend"
            New-Item -ItemType Directory "$api\dist", "$api\dist-servicos\servicos\ingestao", "$api\dist-servicos\servicos\tratamento", "$api\fake-prisma\bin", "$web\fake-next\dist\bin", "$raiz\infra" -Force | Out-Null
            Copy-Item infra\servidor "$raiz\infra" -Recurse
            # Servidor que lê a porta do .env da pasta (como o dotenv faz).
            $srv = @"
          const fs = require('fs'), http = require('http');
          const env = Object.fromEntries(fs.readFileSync(require('path').join(process.cwd(), '.env'), 'utf8').split(/\r?\n/).filter(l => /^[A-Z_]+=/.test(l)).map(l => { const i = l.indexOf('='); return [l.slice(0, i), l.slice(i + 1).replace(/^"|"`$/g, '')]; }));
          const porta = env[process.argv[2]];
          http.createServer((q, r) => { r.writeHead(q.url === '/saude' ? $status : 404, { 'content-type': 'text/plain' }); r.end('$sha ' + process.argv[2]); }).listen(porta, '127.0.0.1');
          "@
            Set-Content "$api\dist\main.js" ($srv.Replace('process.argv[2]', "'PORT'"))
            Set-Content "$api\dist-servicos\servicos\ingestao\main.js" ($srv.Replace('process.argv[2]', "'INGESTAO_PORTA'"))
            Set-Content "$api\dist-servicos\servicos\tratamento\main.js" ($srv.Replace('process.argv[2]', "'TRATAMENTO_PORTA'"))
            Set-Content "$api\fake-prisma\package.json" '{"name":"prisma","version":"0.0.0","bin":{"prisma":"bin/prisma.js"}}'
            Set-Content "$api\fake-prisma\bin\prisma.js" "#!/usr/bin/env node`nconsole.log('prisma falso:', process.argv.slice(2).join(' '));"
            Set-Content "$api\package.json" '{"name":"api","version":"0.0.0","devDependencies":{"prisma":"file:./fake-prisma"}}'
            Set-Content "$web\fake-next\package.json" '{"name":"next","version":"0.0.0"}'
            Set-Content "$web\fake-next\dist\bin\next" "const p = process.argv[process.argv.indexOf('--port') + 1]; require('http').createServer((q, r) => { r.writeHead(200, { 'content-type': 'text/plain' }); r.end('front $sha'); }).listen(p, '127.0.0.1');"
            Set-Content "$web\package.json" '{"name":"web","version":"0.0.0","dependencies":{"next":"file:./fake-next"}}'
            foreach ($d in $api, $web) { Push-Location $d; npm.cmd install --package-lock-only --no-audit --no-fund | Out-Null; Pop-Location }
            $saida = "$env:RUNNER_TEMP\pacotes"; New-Item -ItemType Directory $saida -Force | Out-Null
            tar -czf "$saida\pacote-$sha.tar.gz" -C $raiz kernelpanic-backend frontend infra
            $h = (Get-FileHash "$saida\pacote-$sha.tar.gz" -Algorithm SHA256).Hash.ToLower()
            Set-Content "$saida\pacote-$sha.tar.gz.sha256" "$h  pacote-$sha.tar.gz"
          }
          Pacote $env:SHA_A 200
          Pacote $env:SHA_B 200
          Pacote $env:SHA_C 500

      - name: Deploy A, deploy B, deploy C (quebrado), rollback manual
        run: |
          $p = "$env:RUNNER_TEMP\pacotes"
          function Atual { Split-Path ((Get-Item "$env:BASE\current").Target | Select-Object -First 1) -Leaf }
          function Falhar([string]$m) { Write-Host "::error::$m"; Get-Content "$env:BASE\logs\*.log" -Tail 20 -ErrorAction SilentlyContinue; exit 1 }

          Write-Host '### deploy A'
          & "$p\..\montar-$env:SHA_A\infra\servidor\deploy.ps1" -Sha $env:SHA_A -Pacote "$p\pacote-$env:SHA_A.tar.gz" -DeployRun ensaio
          if ($LASTEXITCODE) { Falhar 'deploy A falhou' }
          if ((Atual) -ne $env:SHA_A) { Falhar "current deveria ser A, é $(Atual)" }

          Write-Host '### API pelo Caddy (/api/saude -> /saude)'
          $r = Invoke-WebRequest http://localhost:8080/api/saude -UseBasicParsing
          if ($r.Content -notlike "$env:SHA_A*") { Falhar "Caddy respondeu '$($r.Content)'" }
          $r = Invoke-WebRequest http://localhost:8080/ -UseBasicParsing
          if ($r.Content -ne "front $env:SHA_A") { Falhar "front respondeu '$($r.Content)'" }

          Write-Host '### deploy B'
          & "$env:BASE\bin\deploy.ps1" -Sha $env:SHA_B -Pacote "$p\pacote-$env:SHA_B.tar.gz" -DeployRun ensaio
          if ($LASTEXITCODE) { Falhar 'deploy B falhou' }
          if ((Atual) -ne $env:SHA_B) { Falhar "current deveria ser B, é $(Atual)" }

          Write-Host '### deploy C (saúde 500): tem de falhar e voltar para B'
          & "$env:BASE\bin\deploy.ps1" -Sha $env:SHA_C -Pacote "$p\pacote-$env:SHA_C.tar.gz" -DeployRun ensaio
          if (-not $LASTEXITCODE) { Falhar 'deploy C deveria ter falhado' }
          if ((Atual) -ne $env:SHA_B) { Falhar "rollback automático deveria voltar para B, está em $(Atual)" }

          Write-Host '### rollback manual para A'
          & "$env:BASE\bin\deploy.ps1" -Rollback -Sha $env:SHA_A -DeployRun ensaio
          if ($LASTEXITCODE) { Falhar 'rollback manual falhou' }
          if ((Atual) -ne $env:SHA_A) { Falhar "current deveria ser A, é $(Atual)" }
          $r = Invoke-WebRequest http://localhost:8080/api/saude -UseBasicParsing
          if ($r.Content -notlike "$env:SHA_A*") { Falhar "depois do rollback a API respondeu '$($r.Content)'" }

          Write-Host '### deploys.log'
          Get-Content "$env:BASE\deploys.log"
          $linhas = @(Get-Content "$env:BASE\deploys.log").Count
          if ($linhas -ne 5) { Falhar "deploys.log deveria ter 5 linhas (A, B, C falha, rollback automático, rollback manual), tem $linhas" }

      - name: Logs dos serviços
        if: always()
        run: |
          Get-ChildItem C:\datapanic\logs, C:\datapanic\servicos -Filter *.log -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 30 }
