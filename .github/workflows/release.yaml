name: Release

# Produção (SCRUM-29). Disparada pelo merge do PR pre-release → release, que é
# o gate manual: a ruleset da release exige aprovação humana e o status
# "pre-release" verde, e só aceita merge commit. O deploy usa o SHA que veio da
# pre-release (o segundo pai do merge), porque é ele que tem pacote e que passou
# na pré-release; o merge commit em si nunca foi testado.
#
# Depois do deploy: tag versao/AAAA-MM-DD e GitHub Release com o changelog
# (commits desde a versão anterior).
#
# Manual (Actions > Release > Run workflow, branch release): repete o deploy de
# um SHA que JÁ entrou na release, ex. depois de corrigir o servidor. Não serve
# para pular o gate: SHA fora da release é recusado.

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      sha:
        description: SHA já mesclado na release (vazio = o último que entrou)
        type: string
        default: ''

permissions: {}

jobs:
  validar:
    name: Passou pelo gate e pela pré-release
    # Criar a branch release (uma vez, pelo admin) não é deploy.
    if: github.event_name != 'push' || !github.event.created
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      statuses: read
    outputs:
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          ENTRADA: ${{ inputs.sha }}
        run: |
          if [ "$GITHUB_REF_NAME" != release ]; then
            echo "::error::Rode a partir da branch release (\"Use workflow from\"). Urgência em produção: use o Hotfix."
            exit 1
          fi
          if [ -n "$ENTRADA" ]; then
            sha=$(git rev-parse --verify --quiet "$ENTRADA^{commit}") \
              || { echo "::error::\"$ENTRADA\" não é um commit deste repositório."; exit 1; }
            git merge-base --is-ancestor "$sha" HEAD \
              || { echo "::error::${sha:0:7} não está na release. Para chegar lá, ele passa pela pré-release e pelo PR aprovado."; exit 1; }
          else
            # Merge commit: o segundo pai é o topo da pre-release.
            sha=$(git rev-parse --verify --quiet HEAD^2) || {
              echo "::error::O último commit da release não é um merge commit. O PR pre-release → release precisa ser mesclado com \"Create a merge commit\" (squash e rebase criam um commit que não tem pacote). Configure a ruleset da release para aceitar só merge commit."
              exit 1
            }
          fi
          estado=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
            --jq '.statuses[] | select(.context == "pre-release") | .state' | head -n 1) || estado=""
          if [ "$estado" != "success" ]; then
            echo "::error::${sha:0:7} não passou na pré-release (status: ${estado:-nenhum}). Ele chega na pré-release pela suíte noturna (Deploy na pré-release). Urgência em produção: use o Hotfix."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Release de \`${sha:0:7}\`." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: validar
    permissions:
      actions: read
      contents: read
      statuses: write
    uses: ./.github/workflows/deploy-vm.yaml
    with:
      sha: ${{ needs.validar.outputs.sha }}
      ambiente: producao
    secrets: inherit

  publicar:
    name: Tag de versão e changelog
    needs: [validar, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.validar.outputs.sha }}
        run: |
          if existente=$(git tag --points-at "$SHA" -l 'versao/*' | head -n 1) && [ -n "$existente" ]; then
            echo "\`${SHA:0:7}\` já é a \`$existente\`: redeploy, sem versão nova." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          anterior=$(git tag -l 'versao/*' --sort=-creatordate | head -n 1)
          dia=$(TZ=America/Sao_Paulo date +%F)
          tag="versao/$dia"; n=2
          while git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; do
            tag="versao/$dia.$n"; n=$((n + 1))
          done
          git tag "$tag" "$SHA"
          git push origin "refs/tags/$tag"
          args=(--title "$tag" --target "$SHA" --generate-notes --latest)
          [ -n "$anterior" ] && args+=(--notes-start-tag "$anterior")
          gh release create "$tag" "${args[@]}"
          echo "Versão \`$tag\` publicada (changelog desde ${anterior:-o início})." >> "$GITHUB_STEP_SUMMARY"
